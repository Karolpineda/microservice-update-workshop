name: CI/CD to EC2

on:
  push:
    branches: [ "qa" ]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t karolpineda/microservice-update-workshop:latest .

      - name: Push Docker Image
        run: docker push karolpineda/microservice-update-workshop:latest

  deploy-to-ec2:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # 1) Descargar la imagen de Docker Hub
            docker pull karolpineda/microservice-update-workshop:latest

            # 2) Detener y eliminar contenedor previo
            docker stop workshop_container || true
            docker rm workshop_container || true

            # 3) Crear archivo .env con las credenciales de la base de datos
            echo "DB_HOST=${{ secrets.DB_HOST }}" > .env
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "PORT=${{ secrets.PORT }}" >> .env

            # 4) Ejecutar el contenedor con persistencia de datos
            docker run -d --name workshop_container \
              --env-file .env \
              -v workshop_data:/data \
              -p 8098:8098 \
              karolpineda/microservice-update-workshop:latest
