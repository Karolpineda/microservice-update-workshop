basePath: /
definitions:
  models.Workshop:
    properties:
      address:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
info:
  contact: {}
  description: API de microservicio para gestión de workshops
  title: Workshop API
  version: "1.0"
paths:
  /health:
    get:
      description: Retorna un mensaje que indica que el microservicio está en funcionamiento
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verifica el estado del microservicio
      tags:
      - Health
  /workshops:
    get:
      description: Devuelve una lista JSON con todos los Workshops existentes en la
        base de datos
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Workshop'
            type: array
      summary: Obtiene todos los Workshops
      tags:
      - Workshops
  /workshops/{id}:
    put:
      consumes:
      - application/json
      description: Modifica un workshop basado en su ID
      parameters:
      - description: ID del Workshop
        in: path
        name: id
        required: true
        type: string
      - description: Datos actualizados del Workshop
        in: body
        name: workshop
        required: true
        schema:
          $ref: '#/definitions/models.Workshop'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Workshop'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Workshop not found
          schema:
            type: string
      summary: Actualiza un workshop existente
      tags:
      - Workshops
swagger: "2.0"
